name: release

# Tag-driven dual-platform release:
#   v* tag push -> Linux .deb (CPack DEB) + Windows .exe installer
#   (CPack NSIS) build, test, package, and publish a GitHub Release with the
#   assets attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev \
            libsndfile1-dev zlib1g-dev libacl1-dev \
            libpipewire-0.3-dev libasound2-dev \
            liblilv-dev lv2-dev pkg-config

      - name: Configure (Release)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb (CPack DEB)
        run: |
          cd build
          cpack -C Release -G DEB

      - name: "Smoke - install .deb and launch the app"
        run: |
          sudo apt-get install -y ./build/misuc_*.deb
          dpkg -l misuc | grep -E "^ii" || (echo "dpkg did not report misuc installed" && exit 1)
          test -x /usr/bin/misuc_app || (echo "/usr/bin/misuc_app missing" && exit 1)
          test -f /usr/share/applications/misuc.desktop || (echo "desktop entry missing" && exit 1)
          test -f /usr/share/metainfo/misuc.appdata.xml || (echo "appstream metadata missing" && exit 1)
          QT_QPA_PLATFORM=offscreen timeout 6 misuc_app || rc=$?
          rc=${rc:-0}
          if [ "$rc" != "0" ] && [ "$rc" != "124" ]; then
            echo "misuc_app exited with rc $rc"; exit 1
          fi
          echo "install + launch smoke OK (rc=$rc)"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/misuc_*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Bootstrap vcpkg (image no longer exports VCPKG_ROOT)
        shell: pwsh
        run: |
          $vcpkgDir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          if (-not (Test-Path (Join-Path $vcpkgDir 'vcpkg.exe'))) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkgDir"
            & (Join-Path $vcpkgDir 'bootstrap-vcpkg.bat') -disableMetrics
          }

      - name: Install vcpkg manifest deps (zlib, sndfile)
        shell: pwsh
        run: >
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe"
          --triplet x64-windows
          --x-install-root="$env:GITHUB_WORKSPACE\vcpkg\installed" install

      - name: Install NSIS (CPack .exe generator)
        shell: pwsh
        run: choco install -y nsis

      - name: Configure (vcpkg deps - zlib, sndfile)
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg\installed"
          -DVCPKG_MANIFEST_INSTALL=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package .exe installer (CPack NSIS)
        shell: pwsh
        run: |
          cd build
          cpack -C Release -G NSIS
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path _CPack_Packages/win64/NSIS/NSISOutput.log) {
              Write-Host "===== NSISOutput.log (last 60 lines) ====="
              Get-Content _CPack_Packages/win64/NSIS/NSISOutput.log | Select-Object -Last 60
            } else { Write-Host "NSISOutput.log missing" }
            if (Test-Path _CPack_Packages/win64/NSIS/project.nsi) {
              Write-Host "===== project.nsi (first 140 lines) ====="
              Get-Content _CPack_Packages/win64/NSIS/project.nsi | Select-Object -First 140
            }
            exit $LASTEXITCODE
          }

      - name: "Smoke - silent-install, verify payload, launch, uninstall"
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build\misuc-*win64.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "no NSIS installer was produced" }
          $dest = 'C:\misuc_ci_install'
          $p = Start-Process -FilePath $exe -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          foreach ($f in 'misuc_app.exe', 'Qt6Core.dll', 'Qt6Widgets.dll',
                        'libsndfile-1.dll', 'zlib1.dll', 'vcruntime140.dll',
                        'msvcp140.dll', 'platforms\qwindows.dll',
                        'imageformats\qgif.dll') {
            if (-not (Test-Path (Join-Path $dest $f))) {
              throw "installer payload missing: $f"
            }
          }
          $app = Start-Process -FilePath (Join-Path $dest 'misuc_app.exe') -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { throw "misuc_app.exe exited after launch" }
          Stop-Process -Id $app.Id -Force
          $un = Join-Path $dest 'Uninstall.exe'
          if (-not (Test-Path $un)) { throw "Uninstall.exe missing" }
          Start-Process -FilePath $un -ArgumentList "/S", "_?=$dest" -Wait
          if (Test-Path (Join-Path $dest 'misuc_app.exe')) {
            throw "uninstall did not remove misuc_app.exe"
          }

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/misuc-*win64.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release (.deb + .exe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release-assets
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'EOF'
          Misuc vXVER

          Platform installers and packages:

          - `misuc_XVER-1_amd64.deb` — **Linux installer (.deb)** for
            Debian/Ubuntu: `sudo apt install ./misuc_XVER-1_amd64.deb`
                          (refreshes menu/desktop caches via dpkg triggers)
          - `misuc-XVER-1-win64.exe` — **Windows installer (.exe)** double
            click to run the themed setup wizard (installs into
            `C:\Program Files\Misuc`, adds Start Menu + Desktop shortcuts,
            and offers "Launch Misuc" on the finish page). The installer
            carries the Qt runtime, the MSVC redist, and every codec DLL —
            no external dependencies on Windows.

          Notes: the v0.3.0 Windows installer shipped without the engine's
          codec/redist DLLs and failed to start on clean machines; vXVER is
          the fixed release with an end-to-end smoke-tested install
          (silent install + app launch + uninstall verified in CI). Audio
          behaviour on real Windows hardware is not yet validated.
          EOF
          sed -i "s/XVER/$VER/g" notes.md
          files=$(find release-assets -type f \( -name "*.deb" -o -name "*.exe" \) -printf "%p ")
          repo_args=(--repo "$GITHUB_REPOSITORY")
          if ! gh release create "$GITHUB_REF_NAME" "${repo_args[@]}" \
             --title "Misuc ${{ github.ref_name }} - Linux .deb + Windows .exe" \
             --notes-file notes.md $files; then
            # Release exists already (re-pointed tag): refresh assets + text.
            gh release upload "$GITHUB_REF_NAME" "${repo_args[@]}" --clobber $files
            gh release edit "$GITHUB_REF_NAME" "${repo_args[@]}" \
              --title "Misuc ${{ github.ref_name }} - Linux .deb + Windows .exe" \
              --notes-file notes.md
          fi
